
name: Pruebas PHP

on:
  pull_request:
  push:

jobs:
  validar-php:
    name: Validar sintaxis PHP
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Revisar archivos PHP
        run: |
          find SistemaTareasEscolares -type f -name "*.php" -print0 | xargs -0 -n 1 php -l
