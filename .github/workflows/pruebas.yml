
name: Pruebas PHP

on:
  pull_request:
  push:

jobs:
  validar-php:
    name: Validar sintaxis PHP
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Revisar archivos PHP
        shell: bash
        run: |
          mapfile -d '' archivos < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './.git/*')

          if [ ${#archivos[@]} -eq 0 ]; then
            echo "No se encontraron archivos PHP."
            exit 1
          fi

          for archivo in "${archivos[@]}"; do
            echo "Revisando: $archivo"
            php -l "$archivo" || exit 1
          done

          echo "Validación PHP completada correctamente."
